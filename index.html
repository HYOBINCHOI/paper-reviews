<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 논문 리뷰 — Paper Reels</title>
  <meta name="description" content="최신 AI 논문을 쉽고 빠르게 이해합시다">
  <meta property="og:title" content="AI 논문 리뷰 — Paper Reels">
  <meta property="og:description" content="최신 AI 논문을 쉽게 · Study AI with me">
  <meta property="og:type" content="website">

  <!-- ★ Google Analytics 4 — YOUR_GA4_ID를 본인 Measurement ID로 교체하세요 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=YOUR_GA4_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'YOUR_GA4_ID');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #fef8fb;   /* 전체 배경 — 아주 연한 핑크-화이트 */
      --surface:     #ffffff;   /* 카드, 헤더 배경 */
      --border:      #f2dde8;   /* 기본 테두리 */
      --border-hover:#e879a0;   /* 호버 테두리 */

      --pink:        #e879a0;   /* 메인 액센트 (단일 핑크) */
      --pink-dark:   #c9517e;   /* 호버·눌림 상태 */
      --pink-pale:   #fce7f3;   /* 태그·뱃지 배경 */
      --pink-softer: #fff0f7;   /* 아주 연한 핑크 영역 */

      --text:        #1e1529;   /* 본문 메인 텍스트 */
      --text-sec:    #6b4f61;   /* 보조 텍스트 */
      --text-muted:  #a8899a;   /* 흐린 텍스트 */

      --shadow-sm:   0 2px 10px rgba(232,121,160,.10);
      --shadow-card: 0 4px 24px rgba(232,121,160,.10);
      --shadow-hover: 0 12px 40px rgba(232,121,160,.18);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Noto Sans KR', system-ui, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* 배경 — 단일 핑크 톤 미세 그림자 */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 55% 35% at 80% 0%, rgba(232,121,160,.09) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }

    .wrap {
      position: relative; z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ─── HERO ─── */
    .hero {
      text-align: center;
      padding: 4rem 0 3rem;
    }

    .avatar-ring {
      display: inline-flex;
      align-items: center; justify-content: center;
      width: 88px; height: 88px;
      border-radius: 50%;
      background: var(--pink);
      padding: 3px;
      margin-bottom: 1.4rem;
      box-shadow: 0 0 0 6px var(--pink-pale);
    }
    .avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem;
    }

    .hero-title {
      font-size: clamp(1.9rem, 5vw, 2.7rem);
      font-weight: 900;
      letter-spacing: -0.025em;
      color: var(--text);
      margin-bottom: .5rem;
    }
    /* 제목의 포인트 단어만 핑크 */
    .hero-title .accent { color: var(--pink); }

    .hero-sub {
      font-size: .95rem;
      color: var(--text-sec);
      line-height: 1.8;
    }
    .hero-sub strong { color: var(--text); font-weight: 700; }

    .hero-badges {
      display: flex;
      justify-content: center;
      gap: .5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .badge {
      font-size: .78rem;
      padding: .28rem .75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--surface);
    }

    /* ─── SECTION HEADER ─── */
    .section-label {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 1.2rem;
    }

    /* ─── PAPER CARDS ─── */
    .papers { padding-bottom: 4rem; }

    .paper-list {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .paper-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.6rem 1.6rem 1.4rem;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition:
        transform .3s cubic-bezier(.22,1,.36,1),
        border-color .25s,
        box-shadow .25s;
      cursor: default;
    }
    .paper-card:hover {
      transform: translateY(-5px);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-hover);
    }

    /* 카드 번호 워터마크 */
    .card-num {
      position: absolute;
      top: -1.4rem; right: 1.4rem;
      font-size: 7rem;
      font-weight: 900;
      color: var(--pink-pale);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .card-emoji-wrap {
      flex-shrink: 0;
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--pink-pale);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
    }

    .card-meta { flex: 1; min-width: 0; }

    .card-tags {
      display: flex; flex-wrap: wrap; gap: .3rem;
      margin-bottom: .45rem;
    }
    .tag {
      font-size: .7rem;
      font-weight: 600;
      padding: .18rem .6rem;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid var(--border);
    }
    .tag-year  { background: var(--pink-pale); color: var(--pink-dark); border-color: #f5c5db; }
    .tag-topic { background: var(--surface);   color: var(--text-muted); }
    .tag-venue { background: var(--pink-softer); color: var(--pink); border-color: #f5c5db; }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -.01em;
      color: var(--text);
      margin-bottom: .15rem;
    }
    .card-subtitle {
      font-size: .85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .card-desc {
      font-size: .9rem;
      color: var(--text-sec);
      line-height: 1.65;
      margin-bottom: 1.1rem;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
    }

    .btn {
      display: inline-flex;
      align-items: center; gap: .4rem;
      text-decoration: none;
      font-size: .85rem;
      font-weight: 700;
      padding: .55rem 1.1rem;
      border-radius: 10px;
      transition: all .2s;
    }

    /* arXiv — 핑크 외곽선 */
    .btn-arxiv {
      border: 1.5px solid var(--pink);
      color: var(--pink);
      background: transparent;
    }
    .btn-arxiv:hover {
      background: var(--pink-pale);
    }

    /* Reels — 단일 핑크 채우기 */
    .btn-reels {
      background: var(--pink);
      color: #fff;
      border: none;
    }
    .btn-reels:hover {
      background: var(--pink-dark);
      transform: scale(1.03);
      box-shadow: 0 4px 16px rgba(232,121,160,.35);
    }

    /* ─── FOOTER ─── */
    footer {
      position: relative; z-index: 1;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 1.4rem 1.25rem;
      text-align: center;
    }
    .footer-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: .5rem;
    }
    footer p { font-size: .8rem; color: var(--text-muted); }
    footer a { color: var(--text-muted); text-decoration: none; font-size: .75rem; }
    footer a:hover { color: var(--pink); }

    @media (max-width: 480px) {
      .hero { padding: 2.5rem 0 2rem; }
      .card-top { gap: .8rem; }
      .card-emoji-wrap { width: 44px; height: 44px; font-size: 1.3rem; border-radius: 11px; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <!-- ── HERO ── -->
  <header class="hero">
    <div class="avatar-ring">
      <div class="avatar-inner">🧠</div>
    </div>
    <h1 class="hero-title">AI <span class="accent">논문 리뷰</span></h1>
    <p class="hero-sub">
      <strong>Study AI with me</strong><br>
      최신 VLA·AI·로봇공학 논문을 쉽게
    </p>
    <div class="hero-badges">
      <span class="badge">🎓 Research</span>
      <span class="badge">📄 Papers</span>
      <span class="badge">🎬 Reels</span>
    </div>
  </header>

  <!-- ── PAPER LIST ── -->
  <section class="papers">
    <p class="section-label">📚 리뷰한 논문들</p>
    <div class="paper-list" id="paper-list"></div>
  </section>

</div>

<footer>
  <div class="footer-inner">
    <p>@studyaiwith</p>
    <a href="admin.html" title="Admin" style="font-size:.8rem;color:var(--text-muted);text-decoration:none;">🔒</a>
  </div>
</footer>

<script>
// ━━ 논문 목록 ━━
const PAPERS = [

  {
  id: 'physvam',
  emoji: '🤖',
  title: 'PhysVAM',
  subtitle: '물리 기반 미래 가치 행동 모델',
  year: '2026/11',
  tags: ['Robotics', 'Dynamic Manipulation', 'VLA'],
  venue: 'arXiv',
  desc: '로봇의 동적 물체 조작을 위해 미래 상호작용의 작업 기여도를 "가치"로 예측하는 모델입니다. 시뮬레이션과 실제 로봇 실험에서 기존 대비 성공률을 27%p 향상시켰습니다.',
  arxiv: 'https://arxiv.org/abs/2611.26105',
  reels: 'https://www.instagram.com/reel/DgCsj5Fyqf8'
},
  
  {
  id: 'actioncodec2',
  emoji: '⚡',
  title: 'ActionCodec2',
  subtitle: '스트리밍 액션 토크나이저',
  year: '2026/11',
  tags: ['Robotics', 'Action Tokenizer', 'VLA'],
  venue: 'arXiv',
  desc: '로봇 행동을 청크 단위가 아닌 스트리밍 방식으로 점진적으로 출력하는 액션 토크나이저입니다. 24개 embodiment, 2만 시간 데이터로 학습해 외부 교란 상황에서도 강건한 실시간 제어가 가능합니다.',
  arxiv: 'https://arxiv.org/abs/2611.15490',
  reels: 'https://www.instagram.com/reel/DgEIcYcS7gI'
}
  
];

function trackClick(paperId, linkType) {
  if (typeof gtag === 'function') {
    gtag('event', 'paper_link_click', { paper_id: paperId, link_type: linkType });
  }
  const key = `click::${paperId}::${linkType}`;
  localStorage.setItem(key, (parseInt(localStorage.getItem(key) || '0') + 1).toString());
  localStorage.setItem(`click::${paperId}::${linkType}::last`, new Date().toISOString());
}

function renderCards() {
  document.getElementById('paper-list').innerHTML = PAPERS.map((p, i) => `
    <article class="paper-card">
      <div class="card-top">
        <div class="card-meta">
          <div class="card-tags">
            <span class="tag tag-year">${p.year}</span>
            ${p.tags.map(t => `<span class="tag tag-topic">${t}</span>`).join('')}
            <span class="tag tag-venue">${p.venue}</span>
          </div>
          <h2 class="card-title">${p.title}</h2>
          <p class="card-subtitle">${p.subtitle}</p>
        </div>
      </div>
      <p class="card-desc">${p.desc}</p>
      <div class="card-actions">
        <a href="${p.arxiv}" target="_blank" rel="noopener" class="btn btn-arxiv"
           onclick="trackClick('${p.id}','arxiv')">📄 arXiv 논문</a>
        <a href="${p.reels}" target="_blank" rel="noopener" class="btn btn-reels"
           onclick="trackClick('${p.id}','reels')">🎬 릴스 보기</a>
      </div>
    </article>
  `).join('');
}

renderCards();
</script>
</body>
</html>
